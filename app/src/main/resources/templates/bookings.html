<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking & Scheduling UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Сервіс Бронювання (UI)</h2>
        <div>
            <a href="/oauth2/authorization/keycloak" class="btn btn-outline-primary">Увійти (Keycloak)</a>
            <a href="/ui/index.html" class="btn btn-outline-secondary">Повний CUD (API)</a>
            <a href="/logout" class="btn btn-outline-danger">Вийти</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Створити нове бронювання</div>
        <div class="card-body">
            <form th:action="@{/ui/bookings}" th:object="${newBooking}" method="post">
                <div class="mb-3">
                    <label class="form-label">Назва події</label>
                    <input type="text" th:field="*{title}" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Email клієнта</label>
                    <input type="email" th:field="*{customerEmail}" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Час початку</label>
                    <input type="datetime-local" th:field="*{startTime}" class="form-control" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Час закінчення</label>
                    <input type="datetime-local" th:field="*{endTime}" class="form-control" required />
                </div>
                <button type="submit" class="btn btn-success">Зберегти</button>
            </form>
        </div>
    </div>

    <h3>Список бронювань</h3>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Email</th>
                <th>Початок</th>
                <th>Кінець</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${bookings}">
                <td th:text="${b.id}">1</td>
                <td th:text="${b.title}">Назва</td>
                <td th:text="${b.customerEmail}">email@example.com</td>
                <td th:text="${b.startTime}">2026-11-01 10:00</td>
                <td th:text="${b.endTime}">2026-11-01 11:00</td>
                <td th:text="${b.status}">PENDING</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
