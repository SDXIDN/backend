server:
  port: 8080

spring:
  application:
    name: app

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/course

      client:
        registration:
          keycloak:
            client-id: booking-app
            client-secret: booking-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/course

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never        # таблиці QRTZ_* створює Liquibase (changeset 002)
    overwrite-existing-jobs: true     # конфіг у коді - джерело істини; повторний деплой не дублює завдання
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: booking-scheduler
      org.quartz.threadPool.threadCount: "5"
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.misfireThreshold: "60000"

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

app:
  simulated-delay-ms: 1000        # імітація повільних викликів (пошта, PDF, календар)
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 20
    thread-name-prefix: booking-async-
    confirmation-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health
