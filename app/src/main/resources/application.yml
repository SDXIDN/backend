server:
  port: 8080

spring:
  application:
    name: app

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/course

      client:
        registration:
          keycloak:
            client-id: booking-app
            client-secret: booking-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid, profile
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/course

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

management:
  endpoints:
    web:
      exposure:
        include: health
